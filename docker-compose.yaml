services:
  onvif-events-telegram:
    build: .
    container_name: onvif-events-telegram
    restart: unless-stopped
    # to have Onvif WS-Discovery working in multicast (UDP 239.255.255.250:3702) (only Linux)
    network_mode: host
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data/repo_store.db:/app/repo_store.db
      - ./data/logs:/app/logs
